name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN. The deploy job needs
# pages: write + id-token: write (see actions/deploy-pages).
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; queued runs wait instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build
        run: vpr build
        env:
          # Project pages serve from /<repo>/, so built asset URLs need the prefix.
          PAGES_BASE: /parchment-quill/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
