<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Parchment Quill is a visual editor for Parchment books. Author pages, preview spreads, and export Content Patcher JSON or SMAPI C#."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fef3c7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0a09" />
    <title>Parchment Quill - Book Editor</title>
    <script>
      try {
        var t = localStorage.getItem("parchment-quill-theme-v1") || "system";
        if (
          t === "dark" ||
          (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
